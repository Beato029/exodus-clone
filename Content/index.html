<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exodus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="crypto-tab.css">
    <link rel="stylesheet" href="container.css">
    <link rel="stylesheet" href="overlay.css">
</head>

<body>

    <div class="global-nav">
        <!-- Left  -->
        <div class="credit-nav">
            <button class="logo-button" data-label="Home" onclick="window.location.href='index.html'"><img
                    src="svg/exodus-logomark.svg"></button>
            <!-- <h1>$<button class="credit-button">0.00</button></h1> -->
        </div>

        <!-- Center -->
        <div class="global-buttons-nav">
            <!-- <button class="global-button portfolio" data-label="Portfolio"
                onclick="window.location.href='portfolio.html'"><img
                    src="global-nav/icon-global-nav-portfolio.svg"></button> -->
            <button class="global-button wallet" data-label="Wallet" onclick="window.location.href='index.html'"><img
                    src="global-nav/icon-global-nav-wallet.svg"></button>
            <!-- <button class="global-button exchange" data-label="Swap" onclick="window.location.href='exchange.html'"><img src="global-nav/icon-global-nav-exchange.svg"></button>
            <button class="global-button onramp" data-label="Buy and Sell" onclick="window.location.href='onramp.html'"><img src="global-nav/icon-global-nav-fiat-onramp.svg"></button>
            <button class="global-button rewards" data-label="Staking" onclick="window.location.href='rewards.html'"><img src="global-nav/icon-global-nav-earn-rewards.svg"></button>
            <button class="global-button nfts" data-label="NTFs" onclick="window.location.href='nfts.html'"><img src="global-nav/icon-global-nav-nfts.svg"></button> -->
        </div>

        <!-- Right -->
        <!-- <div class="settings-nav">
            <button class="settings-button"><img src="svg/icon-advanced.svg"></button>

        </div> -->

    </div>



    <div class="stage">

        <div class="ticker">
            <button class="arrow arrow-left" id="arrowLeft" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>

            <div class="viewport">
                <div class="fade fade-left" id="fadeLeft" style="opacity:0"></div>
                <div class="fade fade-right" id="fadeRight"></div>

                <div class="tabs" id="tabs" role="tablist">
                    <!-- I tab vengono generati da JS -->
                </div>
            </div>

            <button class="arrow arrow-right" id="arrowRight">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
                    stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </div>

    </div>



    <div class="container">
        <div class="coin-data-nav">

            <div class="coin-image-nav">
                <!-- JS -->
                <img id="coin-image" class="coin-image">
            </div>

            <div class="coin-value-nav">
                <!-- JS -->
                <h1 class="coin-value"></h1>
                <h1 class="coin-name"></h1>
            </div>

            <div class="coin-usd-nav">
                <!-- JS -->

                <h1 class="usd-symbol">
                    $
                    <h1 class="coin-usd"></h1>
                </h1>

            </div>
        </div>

        <button class="main-button" onclick="openSendOverlay()">Send</button>
        <button class="main-button" onclick="openReceiveOverlay()">Receive</button>
    </div>


    <div class="send" id="send" style="display: none;">
        <button class="close" onclick="closeSendOverlay()">X</button>
        <h1 class="error-no-fund" id="error-no-fund"></h1>
    </div>


    <div class="overlay" id="overlay" style="display: none;">
        <button class="close" onclick="closeReceiveOverlay()">X</button>

        <img id="coin-image-overlay" class="coin-image">
        <h1 id="coin-name-overlay" class="coin-name-overlay"></h1>
        <div class="receive-address-nav-overlay" onclick="copyAddress()">
            <div class="receive-address-overlay"></div>
            <div class="copied-text-overlay">Copied to clipboard</div>
        </div>
    </div>

    <script src="index.js"></script>

</body>

</html>
